<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in: email first</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;family=Schibsted+Grotesk:wght@700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 40px; background: #FBF8FF; font-family: Roboto, system-ui, sans-serif; color: #1B1B21">

  <div style="display: flex; align-items: center; gap: 10px">
    <div style="width: 40px; height: 40px; border-radius: 11px; background: #3451C7; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(-1.5 0)" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 55 L32 9 L51 55"></path><path d="M20 38 L27 47 L54 20"></path></g></svg>
    </div>
    <span style="font-family: 'Schibsted Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em">Authentik</span>
  </div>

  <sc-if value="{{ onEmail }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 400">Sign in</h1>
        <p style="margin: 0; font-size: 16px; line-height: 24px; color: #46464F">Enter the email you use for Authentik.</p>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 500; color: #46464F; padding-left: 4px">Email</span>
        <input type="email" autocomplete="email" value="{{ email }}" onInput="{{ setEmail }}" style="height: 56px; box-sizing: border-box; border: 2px solid #3451C7; border-radius: 12px; padding: 0 15px; font: 16px Roboto, sans-serif; color: #1B1B21; background: transparent">
      </label>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <button type="button" onClick="{{ next }}" style="height: 52px; border: 0; border-radius: 26px; background: #3451C7; color: #FFFFFF; font: 500 15px Roboto, sans-serif; letter-spacing: 0.1px; cursor: pointer">Continue</button>
        <div style="display: flex; align-items: center; gap: 12px; color: #46464F; font-size: 13px">
          <span style="flex: 1; height: 1px; background: #C7C5D0"></span>
          <span>New here?</span>
          <span style="flex: 1; height: 1px; background: #C7C5D0"></span>
        </div>
        <button type="button" style="height: 52px; border: 1px solid #777680; border-radius: 26px; background: transparent; color: #3451C7; font: 500 15px Roboto, sans-serif; letter-spacing: 0.1px; cursor: pointer">Create an account</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ onPassword }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 400">Welcome back</h1>
        <div style="align-self: flex-start; display: flex; align-items: center; gap: 4px; border: 1px solid #C7C5D0; border-radius: 20px; padding: 0 4px 0 12px; height: 40px">
          <span style="font-size: 14px; color: #1B1B21">{{ shownEmail }}</span>
          <button type="button" onClick="{{ back }}" style="height: 32px; border: 0; border-radius: 16px; background: transparent; color: #3451C7; font: 500 14px Roboto, sans-serif; padding: 0 10px; cursor: pointer">Change</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="pw5" style="font-size: 14px; font-weight: 500; color: #46464F; padding-left: 4px">Password</label>
        <div style="height: 56px; box-sizing: border-box; border: 2px solid #3451C7; border-radius: 12px; display: flex; align-items: center; padding: 0 3px 0 15px">
          <input id="pw5" type="password" autocomplete="current-password" style="flex: 1; min-width: 0; border: 0; outline: none; font: 16px Roboto, sans-serif; color: #1B1B21; background: transparent">
          <button type="button" aria-label="Show password" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#46464F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <a href="#" style="align-self: flex-start; font-size: 14px; font-weight: 500; color: #3451C7; text-decoration: none; padding: 12px 4px">Forgot password?</a>
      </div>
      <button type="button" style="height: 52px; border: 0; border-radius: 26px; background: #3451C7; color: #FFFFFF; font: 500 15px Roboto, sans-serif; letter-spacing: 0.1px; cursor: pointer">Sign in</button>
    </div>
  </sc-if>

  <div style="flex: 1"></div>
  <div style="display: flex; gap: 8px; align-items: flex-start">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#46464F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    <p style="margin: 0; font-size: 12px; line-height: 16px; color: #46464F">Your password is handled by our sign-in provider. Authentik never sees it.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 'email', email: '' };
  }
  renderVals() {
    const email = this.state.email;
    return {
      onEmail: this.state.step === 'email',
      onPassword: this.state.step === 'password',
      email,
      shownEmail: email.trim() || 'thandi@example.com',
      setEmail: (e) => this.setState({ email: e.target.value }),
      next: () => this.setState({ step: 'password' }),
      back: () => this.setState({ step: 'email' }),
    };
  }
}
</script>
</body>
</html>
