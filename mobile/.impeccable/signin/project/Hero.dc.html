<!doctype html>
<html lang="en">

<meta charset="utf-8">

<x-dc>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;family=Schibsted+Grotesk:wght@700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #3451C7; font-family: Roboto, system-ui, sans-serif; color: #1B1B21; overflow: hidden">

  <div style="height: 296px; box-sizing: border-box; padding: 64px 24px 56px; display: flex; flex-direction: column; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(-1.5 0)" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 55 L32 9 L51 55"></path><path d="M20 38 L27 47 L54 20"></path></g></svg>
      <span style="font-family: 'Schibsted Grotesk', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.01em; color: #FFFFFF">Authentik</span>
    </div>
    <p style="margin: 0; font-size: 28px; line-height: 36px; color: #FFFFFF">Check payments, messages and links before you trust them.</p>
  </div>

  <div style="flex: 1; background: #FBF8FF; border-radius: 28px 28px 0 0; box-sizing: border-box; padding: 32px 24px 28px; display: flex; flex-direction: column; gap: 24px">
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400">Sign in</h1>

    <form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 500; color: #46464F; padding-left: 4px">Email</span>
        <input type="email" autocomplete="email" style="height: 56px; box-sizing: border-box; border: 1px solid #777680; border-radius: 12px; padding: 0 16px; font: 16px Roboto, sans-serif; color: #1B1B21; background: transparent">
      </label>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px">
          <label for="pw2" style="font-size: 14px; font-weight: 500; color: #46464F">Password</label>
          <a href="#" style="font-size: 14px; font-weight: 500; color: #3451C7; text-decoration: none">Forgot?</a>
        </div>
        <div style="height: 56px; box-sizing: border-box; border: 1px solid #777680; border-radius: 12px; display: flex; align-items: center; padding: 0 4px 0 16px">
          <input id="pw2" type="password" autocomplete="current-password" style="flex: 1; min-width: 0; border: 0; outline: none; font: 16px Roboto, sans-serif; color: #1B1B21; background: transparent">
          <button type="button" aria-label="Show password" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#46464F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <button type="submit" style="height: 48px; margin-top: 8px; border: 0; border-radius: 24px; background: #3451C7; color: #FFFFFF; font: 500 14px Roboto, sans-serif; letter-spacing: 0.1px; cursor: pointer">Sign in</button>
    </form>

    <div style="flex: 1"></div>
    <p style="margin: 0; text-align: center; font-size: 14px; line-height: 20px; color: #46464F">New to Authentik? <a href="#" style="color: #3451C7; font-weight: 500; text-decoration: none">Create an account</a></p>
  </div>
</div>
</x-dc>

</body>
</html>
